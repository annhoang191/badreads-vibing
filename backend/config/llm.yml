# Model tiers and the task -> tier allowlist (SPEC §4.4). Resolve with Llm::Router.for(:task).
# Never hard-code a model ID elsewhere. Moving a task to a higher tier needs a SPEC change + eval evidence.
# Prices are USD per million tokens (list price, 2026-10). Cache prices for Haiku are estimates.
prompt_version: "2026-11-03.1"

tiers:
  simple:
    model: claude-haiku-5-5
    effort: low
    fallbacks: false            # no server-side fallback for Haiku
    usd_per_mtok: { input: 0.10, output: 0.50, cache_read: 0.01, cache_write: 0.125 }
  orchestrator:
    model: claude-sonnet-5-5
    effort: medium
    fallbacks: true
    usd_per_mtok: { input: 2.00, output: 10.00, cache_read: 0.20, cache_write: 2.50 }
  complex:
    model: claude-opus-5-5
    effort: high
    fallbacks: true
    usd_per_mtok: { input: 4.00, output: 20.00, cache_read: 0.20, cache_write: 5.00 }

tasks:
  orchestrate_recommendations: orchestrator
  expand_queries: simple
  summarize_reader: simple
  rank_candidates: complex      # the ONLY task allowed on the complex tier

agent:
  max_turns: 12
  token_budget: 60000           # summed input+output across orchestrator turns
  wall_clock_seconds: 90
  max_tool_calls:
    search_candidates: 3
    rank_candidates: 2
