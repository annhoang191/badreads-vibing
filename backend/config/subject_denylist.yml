# Subjects that carry no topical meaning and are dropped during import.
# exact: lowercase strings compared against the normalized subject.
# patterns: Ruby regex sources, matched case-insensitively against the normalized subject.
exact:
  - fiction
  - accessible book
  - protected daisy
  - in library
  - large type books
  - lending library
  - english language
  - open library staff picks
  - internet archive wishlist
  - new york times bestseller
  - overdrive
  - ebooks
  - juvenile works
  - translations into english
  - new york times reviewed
  - long now manual for civilization
  - large print
  - general
  - nouvelles
  - romans
  - roman
patterns:
  - 'award winner'
  - 'award nominee'
  - '^award'
  - 'manual for civilization'
  - 'reviewed$'
  - 'bestseller'
  - '^series:'
  - '^collectionid:'
  - '^nyt:'
  - '^\d+$'
  - 'translations'
  - '^reading level'
  - '^award:'
  - '\(fictitious character\)'
