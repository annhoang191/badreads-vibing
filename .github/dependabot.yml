version: 2
updates:
  - package-ecosystem: bundler
    directory: "/backend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # json 3.x breaks ActiveSupport 8.0's encoder; see CLAUDE.md.
      - dependency-name: "json"
        update-types: [ "version-update:semver-major" ]
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
